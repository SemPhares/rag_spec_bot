services:

  rag_api:
    container_name: rag_container
    build: 
      context: .
      dockerfile: Dockerfile.specbot
    ports:
      - 8501:8501

    volumes:
      - specbot/store/vectorstore:/specbot/store/vectorstore
 

  ollama_api:
    container_name: ollama_container
    image: ollama/ollama
    ports:
      - 11434:11434

    volumes:
      - ollama:/root/.ollama
    
    restart: always
    